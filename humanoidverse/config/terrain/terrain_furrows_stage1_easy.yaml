# @package _global_
## ---------------------------------------------------------------------------
#  Furrows Terrain – Stage 1 (Easy)
#  - Shallow grooves, wide spacing, aligned rows, small crest lift
#  - Use for initial stabilization on furrowed fields
## ---------------------------------------------------------------------------

defaults:
  - terrain_base

terrain:
  mesh_type: 'heightfield'
  max_init_terrain_level: 9       # was 0 — confined all envs to row 0 (~128x8m), 2048 envs spilled off mesh; match soft_soil
  horizontal_scale: 0.10
  vertical_scale: 0.005
  border_size: 40

  # Material — match soft_soil (proven to train)
  static_friction: 0.60           # was 0.80
  dynamic_friction: 0.45          # was 0.60
  restitution: 0.02
  friction_combine_mode: multiply

  # PhysX compliant normal contact (paper Fn = kn*δ + cn*δ̇). Defaults 0.0 = rigid
  # (unchanged behavior). Override at runtime for the Stage-0 compliance probe:
  #   ++terrain.compliant_contact_stiffness=50000 ++terrain.compliant_contact_damping=500
  # Paper bands: kn ∈ [50,400] kN/m, cn ∈ [0.2,1.5] kN·s/m; S3 softest kn ∈ [50,150] kN/m.
  compliant_contact_stiffness: 0.0   # N/m   (0 = default rigid PhysX contact)
  compliant_contact_damping: 0.0     # N·s/m

  # Geometry generator — restore real furrow depth (probe with depth=0.001 also failed, so shape not the catapult)
  selected: True
  terrain_kwargs:
    type: 'furrows'
    depth_range: [0.08, 0.12]
    spacing_range: [2.7, 3.2]
    orientation_range_deg: [0.0, 0.0]
    crest_offset: 0.05

  # Layout — 16x16 sub-terrain grid (256 tiles, ~128m x 128m) fits 2048 envs at env_spacing=5
  curriculum: False
  terrain_length: 8.0
  terrain_width: 8.0
  num_rows: 16
  num_cols: 16
  terrain_types: ['flat']
  terrain_proportions: [1.0]

  # Post-processing
  slope_treshold: 0.75
  measure_heights: False
