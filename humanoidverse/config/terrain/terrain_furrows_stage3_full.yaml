# @package _global_
## ---------------------------------------------------------------------------
#  Furrows Terrain – Stage 3 (Full)
#  - Full groove depth and spacing; orientation jitter restored
## ---------------------------------------------------------------------------

defaults:
  - terrain_base

terrain:
  mesh_type: 'heightfield'
  max_init_terrain_level: 0
  horizontal_scale: 0.10
  vertical_scale: 0.005
  border_size: 40

  # Material
  static_friction: 0.60
  dynamic_friction: 0.45
  restitution: 0.02

  # Geometry generator
  selected: True
  terrain_kwargs:
    type: 'furrows'
    depth_range_m: [0.20, 0.30]
    spacing_range_m: [1.5, 2.0]
    orientation_deg: [-5.0, 5.0]
    crest_offset_m: 0.0

  # Layout
  curriculum: False
  terrain_length: 8.0
  terrain_width: 8.0
  num_rows: 1
  num_cols: 1
  terrain_types: ['flat']
  terrain_proportions: [1.0]

  # Post-processing
  slope_treshold: 0.75
  measure_heights: False

