# @package _global_

defaults:
  - terrain_base

terrain:
  # Representation
  mesh_type: 'heightfield'
  horizontal_scale: 0.10
  vertical_scale: 0.005
  border_size: 40

  # Soil regime (Moderate Tilled – freshly tilled with moderate moisture)
  static_friction: 0.60      # target range [0.5, 0.7]
  dynamic_friction: 0.50
  restitution: 0.02
  contact_stiffness: 3.0e4   # N/m (in [1e4, 5e4])
  contact_damping: 1.0e3

  # Geometry features for soil realism
  curriculum: False
  selected: True
  terrain_kwargs:
    type: 'furrows'          # implemented in utils/terrain.py for IsaacGym; for IsaacSim we approximate with generator
    depth_range_m: [0.05, 0.15]
    spacing_range_m: [0.8, 1.2]
    orientation_deg: [-10.0, 10.0]

  terrain_length: 12.0
  terrain_width:  12.0
  num_rows: 1
  num_cols: 1
  terrain_types: ['flat']
  terrain_proportions: [1.0]

  # For IsaacSim generator
  slope_treshold: 0.75
  measure_heights: False

  # Optional friction patches (used by IsaacSim helper if available)
  patchy_friction:
    enabled: True
    coverage_fraction: [0.10, 0.30]
    patch_size_m: [1.0, 2.0]
    low_mu: 0.20
    surprise_patches:
      enabled: True
      size_m: [2.0, 2.0]
      low_mu: 0.20

