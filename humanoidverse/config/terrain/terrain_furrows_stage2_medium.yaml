# @package _global_
## ---------------------------------------------------------------------------
#  Furrows Terrain – Stage 2 (Medium)
#  - Moderate groove depth, moderate spacing, mild orientation jitter
## ---------------------------------------------------------------------------

defaults:
  - terrain_base

terrain:
  mesh_type: 'heightfield'
  max_init_terrain_level: 9
  horizontal_scale: 0.10
  vertical_scale: 0.005
  border_size: 40

  # Material — match stage1 (proven to train under packed env_origins)
  static_friction: 0.60
  dynamic_friction: 0.45
  restitution: 0.02
  friction_combine_mode: multiply

  # Geometry generator (deeper than stage1: 0.15-0.20m furrows, mild orientation jitter)
  selected: True
  terrain_kwargs:
    type: 'furrows'
    depth_range: [0.15, 0.20]
    spacing_range: [2.0, 2.5]
    orientation_range_deg: [-3.0, 3.0]
    crest_offset: 0.03

  # Layout — 16x16 sub-terrain grid for 2048 envs at env_spacing=2.5 (per_tile=8, capacity 2304)
  curriculum: False
  terrain_length: 8.0
  terrain_width: 8.0
  num_rows: 16
  num_cols: 16
  terrain_types: ['flat']
  terrain_proportions: [1.0]

  # Post-processing
  slope_treshold: 0.75
  measure_heights: False
