# @package _global_
## ---------------------------------------------------------------------------
#  Complex terrain preset for advanced locomotion training and evaluation
#  – Multi-terrain environment with obstacles, slopes, and rough surfaces
#  – Used for robust policy training across diverse locomotion challenges
## ---------------------------------------------------------------------------
#
# How to use:
#   1. Advanced terrain for robust locomotion training
#   2. Use in your launch script with +terrain=terrain_locomotion
#   3. Provides challenging environments including:
#      - Flat terrain for baseline
#      - Rough surfaces with varying difficulty
#      - Low obstacles requiring step adjustments
#      - Smooth and rough slopes for incline walking
#
# This preset creates a trimesh environment with multiple terrain types
# distributed according to specified proportions for comprehensive training.
## ---------------------------------------------------------------------------

defaults:
  - terrain_base

terrain:
  # ---- Geometry representation ------------------------------------------------
  mesh_type : 'trimesh'                 # triangle mesh for complex geometry support
  horizontal_scale : 0.1                # [m] grid resolution for heightfield generation
  vertical_scale : 0.005                # [m] height quantization resolution
  border_size : 40                      # [m] safety padding around terrain environments

  # ---- Material mechanics -----------------------------------------------------
  # Standard friction values for diverse terrain training
  static_friction: 1.0                  # high grip for stable locomotion
  dynamic_friction: 1.0                 # consistent friction during sliding
  restitution: 0.0                      # inelastic contact - no bouncing

  # ---- Curriculum and complexity ---------------------------------------------
  curriculum : False                    # static difficulty - no automatic progression
  max_init_terrain_level : 9            # starting curriculum level (if enabled)

  # ---- Terrain generation and measurement -----------------------------------
  selected : False                      # use multi-terrain generation, not single type
  terrain_kwargs : null                 # no custom arguments for individual terrains
  measure_heights : False               # disable height sensing for locomotion focus
  measured_points_x : [ 0.]             # height measurement grid x-coordinates
  measured_points_y : [ 0.]             # height measurement grid y-coordinates

  # ---- Environment layout and diversity -------------------------------------
  terrain_length : 8.                  # [m] size of each terrain patch
  terrain_width : 8.                   # [m] size of each terrain patch
  num_rows: 10                         # number of difficulty progression levels
  num_cols : 20                        # number of terrain type variations

  # ---- Terrain type distribution --------------------------------------------
  # Balanced mix emphasizing rough terrain with some obstacles
  terrain_types : ['flat', 'rough', 'low_obst', 'smooth_slope', 'rough_slope']
  terrain_proportions : [0.2, 0.6, 0.2, 0.0, 0.0]  # 20% flat, 60% rough, 20% obstacles

  # ---- Trimesh processing parameters ----------------------------------------
  slope_treshold : 0.75                 # slopes steeper than this become vertical walls