# @package _global_
# Locomotion environment configuration optimized for soil terrain training
# Based on locomotion.yaml but with conservative command ranges and soil-specific termination

defaults:
  - legged_base

# Env structure
env:
  _target_: humanoidverse.envs.locomotion.locomotion.LeggedRobotLocomotion
  config:
    max_episode_length_s: 20
    locomotion_obs_scales:
      lin_vel: 1.0
      ang_vel: 1.0
      dof_pos: 1.0
      dof_vel: 1.0
      humanoid_commands_scale: 1.0
    
    # CONSERVATIVE command ranges for soil training (Stage 1 curriculum)
    locomotion_command_ranges:
      lin_vel_x: [-0.3, 0.3]  # slightly wider to promote motion on furrows
      lin_vel_y: [-0.3, 0.3]
      ang_vel_yaw: [-0.3, 0.3]
      heading: [-3.14, 3.14]
    locomotion_command_resampling_time: 6.0   # increase variety within short early episodes

    # SOIL-SPECIFIC termination conditions
    termination:
      terminate_by_contact: False # problematic in isaacgym when g1+terrain
      # terminate_by_lin_vel: False
      # terminate_by_ang_vel: False
      terminate_by_gravity: True
      terminate_by_low_height: False  # allow base dips while traversing furrows

    termination_scales:
      termination_min_base_height : 0.20  # lower threshold to avoid premature resets in furrows
      # termination_max_base_vel : 10.0
      # termination_max_base_ang_vel : 5.0
      termination_gravity_x : 0.85
      termination_gravity_y : 0.85


    # Lightweight time-based curriculum to ramp difficulty on furrows
    furrow_curriculum:
      enabled: True
      # thresholds in environment steps (not physics substeps)
      # dt ~= 0.02 s → 50_000 steps ≈ 1000 s of sim time
      phases:
        - step: 0
          feet_height_target: 0.12
          penalty_feet_height: 0.0
          termination: -80.0
        - step: 50000
          feet_height_target: 0.10
          penalty_feet_height: -0.5
          termination: -100.0
        - step: 150000
          feet_height_target: 0.08
          penalty_feet_height: -1.0
          termination: -150.0
        - step: 300000
          feet_height_target: 0.06
          penalty_feet_height: -1.0
          termination: -200.0

    # Gentle reset randomization to prevent immediate post-reset collapses on furrows
    reset_randomization:
      enable: True
      dof_pos_scale_range: [0.8, 1.2]
      root_lin_vel_range: [-0.15, 0.15]
      root_ang_vel_range: [-0.10, 0.10]


# Globally accessible parameters
log_task_name: locomotion

eval_overrides:
  env:
    config: 
      max_episode_length_s: 100000
