# @package _global_

domain_rand:
  # push robots
  push_robots : True
  push_interval_s : [5, 10]
  max_push_vel_xy : 1.0
  # Optional: specify pushes as forces (more physical)
  # If set, _push_robots converts this to a velocity impulse: dv = F * dt / m
  # Falls back to max_push_vel_xy when not provided.
  push_force_N: null           # e.g., 50 for 50 N lateral pushes
  push_duration_s_range: [0.10, 0.20]

  # base com
  randomize_base_com : True
  base_com_range:
    x : [-0.1, 0.1]
    y : [-0.1, 0.1]
    z : [-0.1, 0.1]

  # link mass
  randomize_link_mass : True
  link_mass_range : [0.8, 1.2]

  # pd gain
  randomize_pd_gain : True
  kp_range : [0.75, 1.25]
  kd_range : [0.75, 1.25]

  # friction
  randomize_friction : True
  friction_range : [0.5, 1.25]

  # base mass
  randomize_base_mass : False

  # rfi
  randomize_torque_rfi : True
  rfi_lim : 0.1
  randomize_rfi_lim : True
  rfi_lim_range : [0.5, 1.5]


  # control delay
  randomize_ctrl_delay : True
  ctrl_delay_step_range : [0, 2] # integer max real delay is 90ms
