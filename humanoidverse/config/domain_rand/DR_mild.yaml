# @package _global_
# Mild domain randomization — much-softer reset (Codex thread 019e4a98 -> E).
# The cliff diagnostic (B2) showed a NO_DR-trained plane policy collapses to
# 100% falls the instant full YES_domain_rand is applied, even on flat plane.
# YES_domain_rand uses 1.0 m/s pushes / +-20% mass / friction 0.5-1.25 — far
# too aggressive a shock. This config is ~1/3 the magnitude on every axis so a
# warm-up policy can learn to be DR-robust gradually instead of being shocked.

domain_rand:
  # push robots — gentle nudge, not a shove; longer interval
  push_robots: True
  push_interval_s: [8, 12]
  max_push_vel_xy: 0.3
  push_force_N: null
  push_duration_s_range: [0.10, 0.20]

  # base com — tight
  randomize_base_com: True
  base_com_range:
    x: [-0.03, 0.03]
    y: [-0.03, 0.03]
    z: [-0.03, 0.03]

  # link mass — +-5%
  randomize_link_mass: True
  link_mass_range: [0.95, 1.05]

  # pd gain — +-10%
  randomize_pd_gain: True
  kp_range: [0.9, 1.1]
  kd_range: [0.9, 1.1]

  # friction — narrow, high
  randomize_friction: True
  friction_range: [0.7, 1.0]

  # base mass
  randomize_base_mass: False

  # rfi — small random force injection
  randomize_torque_rfi: True
  rfi_lim: 0.03
  randomize_rfi_lim: True
  rfi_lim_range: [0.8, 1.2]

  # control delay — at most 1 step
  randomize_ctrl_delay: True
  ctrl_delay_step_range: [0, 1]
