# @package _global_
## ---------------------------------------------------------------------------
#  DFH Stage 1.5 (Soil bridge) — S1 furrow geometry, intermediate DFH dynamics
#  Bridges the S1→S2 drag/sinkage cliff that collapsed ep_len from ~14.6s to
#  ~2-3s when promoted directly. Holds geometry constant, ramps soil only.
#  Authored with Codex (gpt-5.2). See thread 019e645b-9f58-7fb3-a4da-7dde95418fda.
## ---------------------------------------------------------------------------

defaults:
  - terrain_furrows_stage1_easy   # keep S1 geometry

terrain:
  dfh_enabled: True

  # Friction halfway between S1 parent (0.45) and S2 override (0.40).
  static_friction:  0.42
  dynamic_friction: 0.42

  dfh:
    horizontal_scale_m: 0.10
    vertical_scale_m:   0.005   # matches stage-1 parent
    terrain_length_m:   8.0
    terrain_width_m:    8.0
    physx_writeback_every_k_steps: 4
    device: "cuda"
    store_furrow_direction: True

    params:
      bekker:
        kc: 1.2e3              # S1 1.4e3 → S2 1.0e3
        k_phi: 6.5e5           # S1 8.2e5 → S2 5.0e5
        n: 1.0
        cohesion: 1.25e4       # S1 1.5e4 → S2 1.0e4
        friction_angle_deg: 31.0
      anisotropy:
        enabled: True
        mu_along: 0.50         # S1 0.55 → S2 0.45
        mu_across: 0.78        # S1 0.70 → S2 0.90 (bridges the +0.45 cliff)
      slip_sinkage_alpha: 0.15 # S1 0.10 → S2 0.20
      slip_sinkage_eps:   1.0e-3
      bulldoze_share:     0.35 # S1 0.30 → S2 0.40
      sinkage_floor_m:   -0.065 # S1 -0.05 → S2 -0.08
      contact_patch_area_m2: 1.75e-3

    writeback_enabled: False
    force_coupling:
      enabled: True
      baseline_mu: 0.42        # matches static/dynamic above
      sinkage_drag_k: 16.0     # S1 8.0 → S2 30.0 — the dominant cliff
      max_drag_force_n: 260.0  # S1 200 → S2 350
      shuffle_env_ids: False
