# @package _global_
## ---------------------------------------------------------------------------
#  DFH Stage 1 (Easy) — Deformable Furrowed Heightfield, soft Bekker params
#  – Reuses Stage-1 furrow geometry, adds plastic deformation
#  – Low slip-sinkage coupling, mild anisotropy
## ---------------------------------------------------------------------------

defaults:
  - terrain_furrows_stage1_easy   # inherit existing geometry + base scaling

terrain:
  # Toggle DFH on for this terrain
  dfh_enabled: True

  dfh:
    horizontal_scale_m: 0.10
    vertical_scale_m:   0.005   # match parent terrain_furrows_stage1_easy.vertical_scale (0.005)
    terrain_length_m:   12.0
    terrain_width_m:    12.0
    physx_writeback_every_k_steps: 4
    device: "cuda"
    store_furrow_direction: True

    params:
      bekker:
        kc: 1.4e3            # cohesive modulus [N/m^(n+1)]
        k_phi: 8.2e5         # frictional modulus [N/m^(n+2)]
        n: 1.0
        cohesion: 1.5e4
        friction_angle_deg: 32.0
      anisotropy:
        enabled: True
        mu_along: 0.55
        mu_across: 0.65
      slip_sinkage_alpha: 0.10   # mild
      slip_sinkage_eps:   1.0e-3
      bulldoze_share:     0.30
      sinkage_floor_m:   -0.05   # cap at 5 cm for Stage 1
      contact_patch_area_m2: 3.45e-3   # Hunter ankle box
