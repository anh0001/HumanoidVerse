# @package _global_
## ---------------------------------------------------------------------------
#  DFH Stage 3 (Full) — wet/loose Bekker, strong anisotropy, deepest sink cap
## ---------------------------------------------------------------------------

defaults:
  - terrain_furrows_stage3_full

terrain:
  dfh_enabled: True

  # Override parent friction to match force-coupling baseline so the
  # additive drag is bounded above zero for both along/across.
  static_friction:  0.30
  dynamic_friction: 0.30

  dfh:
    horizontal_scale_m: 0.10
    vertical_scale_m:   0.002
    terrain_length_m:   8.0
    terrain_width_m:    8.0
    physx_writeback_every_k_steps: 4
    device: "cuda"
    store_furrow_direction: True

    params:
      bekker:
        kc: 5.0e2
        k_phi: 2.0e5
        n: 0.9
        cohesion: 6.0e3
        friction_angle_deg: 26.0
      anisotropy:
        enabled: True
        mu_along: 0.35
        mu_across: 0.90   # widened from 0.60 (Pass3 R1)
      slip_sinkage_alpha: 0.40
      slip_sinkage_eps:   1.0e-3
      bulldoze_share:     0.50
      sinkage_floor_m:   -0.10
      contact_patch_area_m2: 1.75e-3

    writeback_enabled: False
    force_coupling:
      enabled: True
      baseline_mu: 0.30          # deltas now +0.05 / +0.60 (Pass3 R1)
      sinkage_drag_k: 40.0       # bumped 8→40 (Pass3 R1)
      max_drag_force_n: 400.0
      shuffle_env_ids: False
